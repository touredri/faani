name: faani
version: 1.1.8+30
publish_to: none
description: An application to connect tailor and customer, it promote traditional suit. We can book inside and follow best tailor
environment:
  sdk: '>=3.1.5 <4.0.0'

dependencies:
  get: 4.6.6
  cupertino_icons: ^1.0.2
  firebase_core: ^3.7.0
  firebase_auth: ^5.3.2
  cloud_firestore: ^5.4.5
  firebase_storage: ^12.3.5
  firebase_messaging: ^15.1.4
  cloud_functions: ^5.1.3
  firebase_in_app_messaging: ^0.8.0+9
  # firebase_app_check: ^0.3.1+6
  provider: ^6.0.5
  intl_phone_field: ^3.2.0
  pinput: ^5.0.0
  camera: ^0.11.0
  google_mlkit_pose_detection: ^0.14.0
  google_mlkit_commons: ^0.11.0
  google_mlkit_selfie_segmentation: ^0.10.1
  http: ^1.1.0
  shared_preferences: ^2.2.2
  image_picker: ^1.0.4
  url_launcher: ^6.0.12
  smooth_page_indicator: ^1.1.0
  path: ^1.8.3
  intl: ^0.19.0
  cached_network_image: ^3.1.0
  path_provider: ^2.1.1
  share_plus: ^10.1.2
  dio: ^5.3.3
  shimmer: ^3.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_spacer: ^1.0.3
  persistent_bottom_nav_bar_v2: ^5.0.0
  flutter_staggered_grid_view: 0.7.0
  permission_handler: ^11.3.1
  modal_bottom_sheet: 3.0.0
  flutter_svg: ^2.0.14
  easy_stepper: ^0.8.3
  timeline_tile: ^2.0.0
  image_editor_plus: ^1.0.5
  rxdart: ^0.28.0
  flutter_screenutil: ^5.9.0
  flutter_local_notifications: ^18.0.1
  pull_to_refresh_new: ^2.0.5

  flutter:
    sdk: flutter
  connectivity_plus: ^6.0.3
  flutter_rating_stars: ^1.1.0
  flutter_rating_bar: ^4.0.1
  upgrader: ^11.3.0
  # android_intent_plus: ^5.2.0
  back_button_interceptor: ^8.0.0
  just_audio: ^0.9.42
  flutter_sound: ^9.17.0
  image_cropper: ^8.0.2
  timeago: ^3.7.0
  google_sign_in: ^6.2.2
  video_player: ^2.9.2
  firebase_app_check: ^0.3.2+10
  flutter_udid: ^4.0.0
  device_info_plus: ^12.3.0
  flutter_image_compress: ^2.4.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  image_path: assets/images/ic_launcher.png
  background_color: '#F3755F'
  android: true
  ios: true
  remove_alpha_ios: true

flutter:
  assets:
    - assets/images/
    - assets/images/measurement.png
    - assets/locales/
    - assets/svg/
    - assets/svg/measurep.svg
    - assets/svg/dress.svg
    - assets/svg/dressmaker.svg
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: Mochiy Pop One
      fonts:
        - asset: assets/fonts/MochiyPopOne-Regular.ttf
          weight: 400
  uses-material-design: true
